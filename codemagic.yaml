workflows:
  ios-release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependencias de Flutter
        script: |
          flutter pub get
      - name: Inicializar llavero de firmas
        script: |
          keychain initialize
      - name: Obtener o crear certificados y perfiles en Apple automáticamente
        script: |
          app-store-connect fetch-signing-files "com.metasociedad.inmuebles" \
            --type IOS_APP_STORE \
            --create
      - name: Añadir certificados al llavero
        script: |
          keychain add-certificates
      - name: Aplicar perfiles al proyecto Xcode
        script: |
          xcode-project use-profiles
      - name: Compilar paquete IPA firmado
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
