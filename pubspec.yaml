name: ms_inmuebles_app
description: "Aplicación móvil minimalista para visualización de reportes y gestión SaaS de MS Inmuebles."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2

  # Networking & Serialization
  http: ^1.2.1

  # Local Persistence
  shared_preferences: ^2.2.3

  # Formatting & UI Helpers
  intl: ^0.19.0
  google_fonts: ^6.2.1
  
  # Icons & Charts
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0

  # QR Code Scanning
  mobile_scanner: ^6.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
